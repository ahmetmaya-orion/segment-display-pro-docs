name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        # Single source of truth; includes mike so it is available when
        # versioning is switched on (see README "Versioning with mike").
        run: pip install -r requirements.txt

      # Versioned deploys (mike) - enable together with the `extra.version`
      # block in mkdocs.yml. mike needs a git identity to commit to gh-pages:
      # - name: Configure git for mike
      #   run: |
      #     git config user.name "github-actions[bot]"
      #     git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # - name: Deploy versioned docs
      #   run: |
      #     mike deploy v1.0 latest --update-aliases --push
      #     mike set-default latest --push
      #
      # NOTE: once mike owns gh-pages, remove the step below. `mkdocs
      # gh-deploy --force` pushes a flat site that would wipe all versions.

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
