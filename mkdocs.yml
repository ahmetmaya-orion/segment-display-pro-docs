site_name: Segment Display Pro
site_description: User manual for the Segment Display Pro Blender add-on.
site_author: Segment Display Pro
copyright: Copyright &copy; OrionNovember.Studio

repo_name: segment-display-pro-docs
repo_url: https://github.com/segment-display-pro/segment-display-pro-docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep-orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.mark
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

# Version dropdown (mike). Disabled for now - uncomment to enable, and see
# README "Versioning with mike" for the full checklist. Only takes effect
# once versions.json exists on the deployed branch (i.e. after the first
# `mike deploy`), until then the dropdown simply never renders.
# extra:
#   version:
#     provider: mike

plugins:
  - search

nav:
  - Home: index.md
  - Introduction: introduction.md
  - Installation & Activation: installation.md
  - Preferences & Settings: prefs_and_settings.md
  - Troubleshooting: troubleshooting.md
  - Input Categories:
      - Numbers: in_cat_numbers.md
      - Alphanumeric: in_cat_alphanum.md
      - Time: in_cat_time.md
  - Separators: separators.md